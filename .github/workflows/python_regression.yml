name: SIGMA Python Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "src/sigma/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python_regression.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    name: Python 3.11 Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SIGMA and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run full Python test suite
        run: python -m pytest -q -ra
