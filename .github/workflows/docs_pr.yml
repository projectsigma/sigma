name: SIGMA Documentation PR Build

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/sigma/**'
      - 'README.md'
      - 'SIGMA_EXPLORER.md'
      - 'pyproject.toml'
      - 'tests/test_documentation_gap_rollup_alignment.py'
      - '.github/workflows/docs_pr.yml'
permissions:
  contents: read

jobs:
  jupyter-book:
    name: Build documentation (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build Jupyter Book
        run: jupyter-book build docs/book
