name: SIGMA Explorer JavaScript Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer-javascript:
    name: Explorer JS Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check src/sigma/web/static/network-model.js
          node --check src/sigma/web/static/app.js
          node --check src/sigma/web/static/route-worker.js
          node --check tests/test_browser_routing_worker.js
          for test in tests/test_explorer_*.js; do
            node --check "$test"
          done

      - name: Run all Explorer JavaScript regressions
        shell: bash
        run: |
          # Keep testing after each failure so one PR run reveals every failing test.
          failures=0
          echo "::group::Run directed-network regression tests"
          node tests/test_explorer_network.js || { echo "::error file=tests/test_explorer_network.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Test centroid sector palette and selection styling"
          node tests/test_explorer_centroid_palette.js || { echo "::error file=tests/test_explorer_centroid_palette.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Verify Explorer controls and offline map"
          node tests/test_explorer_ui_defaults.js || { echo "::error file=tests/test_explorer_ui_defaults.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Toolbar UI"
          node tests/test_explorer_toolbar_ui.js || { echo "::error file=tests/test_explorer_toolbar_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Refinement UI"
          node tests/test_explorer_refinement_ui.js || { echo "::error file=tests/test_explorer_refinement_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Depth and defaults"
          node tests/test_explorer_final_ui.js || { echo "::error file=tests/test_explorer_final_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Theme UI"
          node tests/test_explorer_theme_ui.js || { echo "::error file=tests/test_explorer_theme_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Visual polish"
          node tests/test_explorer_polish_ui.js || { echo "::error file=tests/test_explorer_polish_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Dark graph styling"
          node tests/test_explorer_dark_graph_ui.js || { echo "::error file=tests/test_explorer_dark_graph_ui.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Multi-step exact road routes"
          node tests/test_explorer_multistep_routes.js || { echo "::error file=tests/test_explorer_multistep_routes.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Three-color reciprocal multi-step routes"
          node tests/test_explorer_route_colors.js || { echo "::error file=tests/test_explorer_route_colors.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Graph legibility and focus controls"
          node tests/test_explorer_graph_legibility.js || { echo "::error file=tests/test_explorer_graph_legibility.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Establishment finder"
          node tests/test_explorer_finder.js || { echo "::error file=tests/test_explorer_finder.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Collapsible right panel"
          node tests/test_explorer_panel_collapse.js || { echo "::error file=tests/test_explorer_panel_collapse.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Map opacity by network depth"
          node tests/test_explorer_depth_opacity.js || { echo "::error file=tests/test_explorer_depth_opacity.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Interaction latency and route cancellation"
          node tests/test_explorer_latency.js || { echo "::error file=tests/test_explorer_latency.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Browser shortest-road routing worker"
          node tests/test_browser_routing_worker.js || { echo "::error file=tests/test_browser_routing_worker.js::Browser routing regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Unclustered sector and partition visibility"
          node tests/test_explorer_unclustered_partition_visibility.js || { echo "::error file=tests/test_explorer_unclustered_partition_visibility.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Hovered scored and unclustered Voronoi outlines"
          node tests/test_explorer_hover_partition_points.js || { echo "::error file=tests/test_explorer_hover_partition_points.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Adaptive Explorer rendering"
          node tests/test_explorer_adaptive_rendering.js || { echo "::error file=tests/test_explorer_adaptive_rendering.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Adaptive Explorer selection"
          node tests/test_explorer_adaptive_selection.js || { echo "::error file=tests/test_explorer_adaptive_selection.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Native point vector LOD"
          node tests/test_explorer_vector_lod_v7.js || { echo "::error file=tests/test_explorer_vector_lod_v7.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "::group::Geographic name labels"
          node tests/test_explorer_location_labels.js || { echo "::error file=tests/test_explorer_location_labels.js::Explorer regression failed"; failures=$((failures + 1)); }
          echo "::endgroup::"
          echo "Explorer JavaScript failures: $failures / 23"
          if [ "$failures" -ne 0 ]; then exit 1; fi
