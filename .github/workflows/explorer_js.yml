name: SIGMA Explorer JavaScript Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer-javascript:
    name: Explorer JS Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check src/sigma/web/static/network-model.js
          node --check src/sigma/web/static/app.js
          node --check tests/test_explorer_network.js

      - name: Run directed-network regression tests
        run: node tests/test_explorer_network.js

      - name: Test centroid sector palette and selection styling
        run: node tests/test_explorer_centroid_palette.js

      - name: Verify Explorer controls and offline map
        run: node tests/test_explorer_ui_defaults.js

      - name: Toolbar UI
        run: node tests/test_explorer_toolbar_ui.js

      - name: Refinement UI
        run: node tests/test_explorer_refinement_ui.js

      - name: Depth and defaults
        run: node tests/test_explorer_final_ui.js

      - name: Theme UI
        run: node tests/test_explorer_theme_ui.js

      - name: Visual polish
        run: node tests/test_explorer_polish_ui.js

      - name: Dark graph styling
        run: node tests/test_explorer_dark_graph_ui.js
